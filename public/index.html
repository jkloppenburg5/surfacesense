            L.DomEvent.disableClickPropagation(div);
            return div;

        layerToggle.addTo(map);

        document.getElementById("cb-surface").addEventListener("change", e => {
            if (e.target.checked) {
                map.addLayer(surfaceLayer);
            } else {

            }

        document.getElementById("cb-points").addEventListener("change", e => {

        // Get user location using IP geolocation
        async function getLocation() {
            const endpoint = 'http://ip-api.com/json/?fields=status,message,lat,lon';
            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                if (data.status === "success") {
                    const lat = data.lat;
                    const lon = data.lon;
                    
                    // Display location in HTML
                    document.getElementById('location').innerHTML = 
                        `Your location: <br>Latitude: ${lat}<br>Longitude: ${lon}`;

                    // Add marker at user's location
                    L.marker([lat, lon]).addTo(map).bindPopup("You are here!").openPopup();
                    
                    // Add circle around location (1km radius)
                    L.circle([lat, lon], { radius: 1000 }).addTo(map);

                    // Center map on user's location
                    map.setView([lat, lon], 13);
                } else {
                    // Handle API error
                    document.getElementById('location').innerText = 
                        `Unable to retrieve location: ${data.message}`;
                }
            } catch (err) {
                console.error("Error getting geolocation", err);
            }
        }
        getLocation(); // Execute location fetch

        // FETCH RAW POINTS from server API
        async function fetchSensorData() {
            try {
                const response = await fetch('/api/sensor-data');
                const data = await response.json();

                markerLayer.clearLayers(); // Remove previous points

                // Create marker for each sensor reading
                data.forEach(d => {
                    L.marker([d.latitude, d.longitude])
                    .bindPopup(`Time: ${d.recorded_at}<br>Alt: ${d.altitude}<br>Speed: ${d.speed}`)
                    .addTo(markerLayer);
                });
            } catch (err) {
                console.error('Error fetching sensor data:', err);
            }
        }

        // --- FETCH SURFACE CLASSIFICATION DATA ---

        async function loadSurfaceClassification() {
            try {
                const resp = await fetch("/api/classify");
                if (!resp.ok) {
                    console.error("Failed to fetch classification", resp.statusText);
                    return;
                }

                const data = await resp.json();
                surfaceLayer.clearLayers();

                data.segments.forEach(seg => {
                    const feature = {
                        type: "Feature",
                        geometry: {
                            type: "LineString",
                            coordinates: [
                                [seg.start_lon, seg.start_lat],
                                [seg.end_lon, seg.end_lat]
                            ]
                        },
                        properties: {
                            surface: seg.surface,

                            log_ratio: seg.features?.log_ratio,
                            p_1_3: seg.features?.p_1_3,
                            p_7_15: seg.features?.p_7_15,

                            start_lat: seg.start_lat,
                            start_lon: seg.start_lon,
                            end_lat: seg.end_lat,
                            end_lon: seg.end_lon,

                            start_time: new Date(seg.start_t * 1000).toISOString(),
                            end_time: new Date(seg.end_t * 1000).toISOString()
                        }
                    };

                    surfaceLayer.addData(feature);
                });

                // 🔍 Auto-zoom to latest classification
                const bounds = surfaceLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds.pad(0.2));
                }

            } catch (err) {
                console.error("Error loading surface classification:", err);
            }
        }
