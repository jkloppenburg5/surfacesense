<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SurfaceSense Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        #map { height: 90vh; width: 100%; }
    </style>
</head>
<body>
    <h1>Surfacesense Map</h1>
    <div id="location"></div>
    <div id="map"></div>

    <!-- Upload Button + Progress IU
     -- file picker
     -- progress bar
     -- status message area
     -- dedicated upload logic file -->
    <h2>Upload Sensor File</h2>
    <input type="file" id="fileInput" accept=".csv,.txt" />
    <br><br>
    <progress id="uploadProgress" value="0" max="100" style="width:300px; display:none;"></progress>
    <div id="uploadStatus"></div>

    <button id="showSurfaceBtn">Show Surface Types</button>
    <br><br>

    <script src="upload.js"></script>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', () => {

        // --- Initialize Leaflet map ---
        const map = L.map('map').setView([43.0731, -89.4012], 13);

        // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        //     attribution: '&copy; OpenStreetMap contributors'
        // }).addTo(map);

        L.tileLayer(
            "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
            {
                attribution:
                "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics",
                maxZoom: 19
            }
        ).addTo(map);

        let markerLayer = L.layerGroup().addTo(map);        // Layer for raw points
        let reconstructedLinesLayer = L.geoJSON(null, {    // Layer for road-aligned lines
            style: feature => ({
                color: feature.properties.on_road ? '#2ecc71' : '#e74c3c',
                weight: 4,
                opacity: 0.9
            }),
            onEachFeature: function(feature, layer) {
                const p = feature.properties || {};
                const start = p.start_time || '';
                const end = p.end_time || '';
                const avgSpeed = p.avg_speed ? p.avg_speed.toFixed(2) : '';
                const vibVar = p.vibration_variance ? p.vibration_variance.toFixed(4) : '';
                layer.bindPopup(`
                    <strong>Segment:</strong> ${start} → ${end}<br/>
                    Avg speed: ${avgSpeed}<br/>
                    Vibration variance: ${vibVar}<br/>
                    On Road: ${p.on_road ? '✅' : '❌'}<br/>
                    Points: ${p.point_count || 0}
                `);
                layer.on('mouseover', () => layer.openPopup());
                layer.on('mouseout', () => layer.closePopup());
            }
        }).addTo(map);

        const surfaceLayer = L.geoJSON(null, {
            style: f => ({
                color: f.properties.surface === "gravel" ? "orange" : "blue",
                weight: 5,
                opacity: 0.85
            }),
            onEachFeature: (feature, layer) => {
                const p = feature.properties;

                layer.bindPopup(`
                    <strong>Surface:</strong> ${p.surface}<br/>
                    <strong>Log Ratio:</strong> ${p.log_ratio.toFixed(2)}<br/>
                    P(1–3 Hz): ${p.p_1_3.toExponential(2)}<br/>
                    P(7–15 Hz): ${p.p_7_15.toExponential(2)}
                `);
            }
        }).addTo(map);


        // --- NEW: Get user location ---
        async function getLocation() {
            const endpoint = 'http://ip-api.com/json/?fields=status,message,lat,lon';
            try {
                const response = await fetch(endpoint);
                const data = await response.json();
                if (data.status === "success") {
                    const lat = data.lat;
                    const lon = data.lon;
                    document.getElementById('location').innerHTML = 
                        `Your location: <br>Latitude: ${lat}<br>Longitude: ${lon}`;

                    // Add marker and circle
                    L.marker([lat, lon]).addTo(map).bindPopup("You are here!").openPopup();
                    L.circle([lat, lon], { radius: 1000 }).addTo(map);

                    map.setView([lat, lon], 13);
                } else {
                    document.getElementById('location').innerText = 
                        `Unable to retrieve location: ${data.message}`;
                }
            } catch (err) {
                console.error("Error getting geolocation", err);
            }
        }
        getLocation();

        // --- FETCH RAW POINTS ---
        async function fetchSensorData() {
            try {
                const response = await fetch('/api/sensor-data');
                const data = await response.json();

                markerLayer.clearLayers(); // Clear previous points

                data.forEach(d => {
                    L.marker([d.latitude, d.longitude])
                    .bindPopup(`Time: ${d.recorded_at}<br>Alt: ${d.altitude}<br>Speed: ${d.speed}`)
                    .addTo(markerLayer);
                });
            } catch (err) {
                console.error('Error fetching sensor data:', err);
            }
        }

        // --- FETCH ROAD-ALIGNED POLYLINES ---
        async function loadReconstructedRoutes() {
            try {
                const resp = await fetch('/routes/reconstructed');
                if (!resp.ok) {
                    console.error('Failed to fetch reconstructed routes', resp.statusText);
                    return;
                }

                const data = await resp.json();
                reconstructedLinesLayer.clearLayers();

                data.segments.forEach(seg => {
                    if (!seg.matched_line) return;

                    const startTime = seg.raw_points[0]?.t ? new Date(seg.raw_points[0].t*1000).toISOString() : '';
                    const endTime = seg.raw_points[seg.raw_points.length-1]?.t ? new Date(seg.raw_points[seg.raw_points.length-1].t*1000).toISOString() : '';
                    const avgSpeed = seg.raw_points.length ? (seg.raw_points.reduce((s,p)=>s+(p.speed||0),0)/seg.raw_points.length) : 0;

                    const feature = {
                        type: 'Feature',
                        geometry: seg.matched_line,
                        properties: {
                            on_road: true, // assume matched = on-road
                            start_time: startTime,
                            end_time: endTime,
                            avg_speed: avgSpeed,
                            vibration_variance: 0,
                            point_count: seg.raw_points.length
                        }
                    };
                    reconstructedLinesLayer.addData(feature);
                });

                // Auto-fit map bounds to lines
                const bounds = reconstructedLinesLayer.getBounds();
                if (bounds.isValid()) map.fitBounds(bounds.pad(0.2));

            } catch (err) {
                console.error('Error loading reconstructed routes:', err);
            }
        }

        async function loadSurfaceClassification() {
            try {
                const resp = await fetch("/api/classify");
                if (!resp.ok) return;

                const data = await resp.json();
                surfaceLayer.clearLayers();

                data.segments.forEach(seg => {
                    const feature = {
                        type: "Feature",
                        geometry: {
                            type: "LineString",
                            coordinates: [
                                [seg.start_lon, seg.start_lat],
                                [seg.end_lon, seg.end_lat]
                            ]
                        },
                        properties: {
                            surface: seg.surface,
                            log_ratio: seg.features.log_ratio,
                            p_1_3: seg.features.p_1_3,
                            p_7_15: seg.features.p_7_15
                        }
                    };

                    surfaceLayer.addData(feature);
                });

            } catch (err) {
                console.error("Error loading surface classification:", err);
            }
        }


        // --- UI CONTROLS ---
        const routeControl = L.control({position: 'topright'});
        routeControl.onAdd = function(map) {
            const div = L.DomUtil.create('div', 'route-controls leaflet-bar');
            div.innerHTML = `
                <label><input type="checkbox" id="cb-show-points"> Show Points</label><br/>
                <label><input type="checkbox" id="cb-offroad-only"> Off-Road Only</label><br/>
                <button id="btn-reload-routes">Reload Routes</button>
            `;
            L.DomEvent.disableClickPropagation(div);
            return div;
        };
        routeControl.addTo(map);

        // --- Show/hide raw points ---
        document.getElementById('cb-show-points').addEventListener('change', e => {
            if (e.target.checked) map.addLayer(markerLayer);
            else map.removeLayer(markerLayer);
        });

        // --- Filter off-road segments ---
        document.getElementById('cb-offroad-only').addEventListener('change', e => {
            const offOnly = e.target.checked;
            reconstructedLinesLayer.eachLayer(layer => {
                const onRoad = layer.feature.properties.on_road;
                if (offOnly && onRoad) layer.setStyle({opacity:0, interactive:false});
                else layer.setStyle({opacity:0.9, interactive:true});
            });
        });

        // --- Reload reconstructed routes ---
        document.getElementById('btn-reload-routes').addEventListener('click', loadReconstructedRoutes);

        // --- Show surface types ---
        document.getElementById("showSurfaceBtn").onclick = loadSurfaceClassification;

        // --- INITIAL LOAD ---
        // Raw points only if explicitly requested
        // fetchSensorData(); // Uncomment if you want points by default
        loadReconstructedRoutes();

    });
    </script>

</body>
</html>
