        /* =========================================================

        /* =========================================================

        /* =========================================================

        #hamburgerPanel {
            position: fixed;
            top: 52px;              /* aligns below toolbar */

        /* PANEL CONTENT */
        #hamburgerPanel .panel-header {

        /* ---------------------------------------------------------

        /* =========================================================

<body>

        <div class="toolbar-right">

            <!-- Hamburger menu button (Step 1: visual only) -->

    <!-- ===============================

    <div id="hamburgerPanel" aria-hidden="true">

        <div class="panel-header">
            <strong>Getting Started</strong>
        </div>

        <div class="panel-section">
            <p class="panel-hint">
                New here?<br>

        <div class="panel-section">

            <a href="/downloads/surfacesense_template.csv" download>

        <hr class="panel-divider" />

        <div class="panel-section">
            <h4>Map Layers</h4>

            <label class="panel-checkbox">
                <input type="checkbox" id="panelSurfaceToggle" checked />

    <div id="map"></div>
    <!-- Container where the Leaflet map will be rendered -->

    <!-- External JavaScript for file upload functionality -->
    <script src="upload.js"></script>
    
    <!-- Main application JavaScript -->
    <script>
    // Wait for DOM to be fully loaded before executing
    document.addEventListener('DOMContentLoaded', () => {

        // ---------------- STATUS HELPER ----------------
        // Safe helper: does nothing if statusText is not present
        function setStatus(text) {
            const el = document.getElementById("statusText");
            if (el) el.innerText = text;
        }

        /// --- CREATE AND INITIALIZE Leaflet map --- ///


        // Create map instance in 'map' div, centered on Madison, WI coordinates
        // const map = L.map('map').setView([43.0731, -89.4012], 13);

        // Create map instance in 'map' div, centered on Madison, WI
        const map = L.map('map', {
        zoomControl: false
        }).setView([43.0731, -89.4012], 13);

        // 🔧 Required when map is rendered under an overlay toolbar
        // Ensures Leaflet recalculates container size correctly
        setTimeout(() => {
        map.invalidateSize();
        }, 0);


        L.control.zoom({
            position: "bottomleft"
        }).addTo(map);


        // [latitude, longitude], zoom level 13

        // Alternative: OpenStreetMap base layer (commented out)
        // L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        //     attribution: '&copy; OpenStreetMap contributors'
        // }).addTo(map);

        // // Use Esri satellite imagery as base map layer
        // L.tileLayer(
        //     "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        //     {
        //         attribution: "Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics",
        //         maxZoom: 19 // Maximum zoom level allowed
        //     }
        // ).addTo(map);


        /// --- BASEMAPS --- ///

        
                const esriImagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
            attribution: "Tiles © Esri",
            maxZoom: 19
        }
        );

        const esriTopo = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
        {
            attribution: "Tiles © Esri",
            maxZoom: 19
        }
        );

        const osm = L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "© OpenStreetMap contributors",
            maxZoom: 19
        }
        );

        // Default basemap
        esriImagery.addTo(map);

        // Basemap control
        const baseMaps = {
        "Satellite": esriImagery,
        "Topo": esriTopo,
        "OpenStreetMap": osm
        };


        /// --- LAYERS --- ///


        let markerLayer = L.layerGroup().addTo(map);

        const surfaceLayer = L.geoJSON(null, {
            style: f => ({
                color: f.properties.surface === "gravel" ? "orange" : "blue",
                weight: 5,
                opacity: 0.9
            }),
            onEachFeature: (feature, layer) => {
                const p = feature.properties || {};

                const fmt = (v, d = 3) =>
                    (v === undefined || v === null || isNaN(v))
                        ? "—"
                        : Number(v).toFixed(d);

                layer.bindPopup(`
                    <strong>Surface:</strong> ${p.surface}<br/>

                    <hr/>

                    <strong>Log Ratio:</strong> ${fmt(p.log_ratio)}<br/>
                    <strong>P(1–3 Hz):</strong> ${fmt(p.p_1_3)}<br/>
                    <strong>P(7–15 Hz):</strong> ${fmt(p.p_7_15)}<br/>

                    <hr/>

                    <strong>Start Lat/Lon:</strong><br/>
                    ${fmt(p.start_lat, 6)}, ${fmt(p.start_lon, 6)}<br/>

                    <strong>End Lat/Lon:</strong><br/>
                    ${fmt(p.end_lat, 6)}, ${fmt(p.end_lon, 6)}<br/>

                    <hr/>

                    <strong>Start:</strong><br/>
                    ${p.start_time || "—"}<br/>

                    <strong>End:</strong><br/>
                    ${p.end_time || "—"}
                `);
            }
        }).addTo(map);

        // const overlayMaps = {
        //     "Surface classification": surfaceLayer,
        //     "Raw GPS points": markerLayer
        // };

        // --------------------------------------------------
        // HAMBURGER PANEL → LEAFLET LAYER TOGGLES (STEP 5)
        // --------------------------------------------------

        document
            .getElementById("panelSurfaceToggle")
            .addEventListener("change", e => {
                e.target.checked
                    ? map.addLayer(surfaceLayer)
                    : map.removeLayer(surfaceLayer);
            });

        document
            .getElementById("panelPointsToggle")
            .addEventListener("change", e => {
                e.target.checked
                    ? map.addLayer(markerLayer)
                    : map.removeLayer(markerLayer);
            });


        /// --- CONTROLS --- ///


        L.control
            .layers(baseMaps, null, {
                collapsed: true,
                position: "bottomright"
            })
            .addTo(map);

        L.Control.geocoder({
            defaultMarkGeocode: true,
            placeholder: "Find address…",
            position: "bottomright"
        })
            .on("markgeocode", e => {
                map.fitBounds(e.geocode.bbox);
        })
        .addTo(map);

        /// --- APP LOGIC --- ///


        // FETCH RAW POINTS from server API
        async function fetchSensorData() {
            try {
                const response = await fetch('/api/sensor-data');
                const data = await response.json();

                markerLayer.clearLayers(); // Remove previous points

                // Create marker for each sensor reading
                data.forEach(d => {
                    L.marker([d.latitude, d.longitude])
                    .bindPopup(`Time: ${d.recorded_at}<br>Alt: ${d.altitude}<br>Speed: ${d.speed}`)
                    .addTo(markerLayer);
                });
            } catch (err) {
                console.error('Error fetching sensor data:', err);
            }
        }

        // --- FETCH SURFACE CLASSIFICATION DATA ---

        async function loadSurfaceClassification() {
            try {
                const resp = await fetch("/api/classify");
                if (!resp.ok) {
                    console.error("Failed to fetch classification", resp.statusText);
                    return;
                }

                const data = await resp.json();
                surfaceLayer.clearLayers();

                data.segments.forEach(seg => {
                    const feature = {
                        type: "Feature",
                        geometry: {
                            type: "LineString",
                            coordinates: [
                                [seg.start_lon, seg.start_lat],
                                [seg.end_lon, seg.end_lat]
                            ]
                        },
                        properties: {
                            surface: seg.surface,

                            log_ratio: seg.features?.log_ratio,
                            p_1_3: seg.features?.p_1_3,
                            p_7_15: seg.features?.p_7_15,

                            start_lat: seg.start_lat,
                            start_lon: seg.start_lon,
                            end_lat: seg.end_lat,
                            end_lon: seg.end_lon,

                            start_time: new Date(seg.start_t * 1000).toISOString(),
                            end_time: new Date(seg.end_t * 1000).toISOString()
                        }
                    };

                    surfaceLayer.addData(feature);
                });

                // 🔍 Auto-zoom to latest classification
                const bounds = surfaceLayer.getBounds();
                if (bounds.isValid()) {
                    map.fitBounds(bounds.pad(0.2));
                }

            } catch (err) {
                console.error("Error loading surface classification:", err);
            }
        }

        async function locateByIP() {
            // const status = document.getElementById("statusText");
            // status.innerText = "Locating (approx)…";
            setStatus("Analyzing…");

            try {
                const resp = await fetch("http://ip-api.com/json/?fields=status,lat,lon,city,regionName");
                // const resp = await fetch("https://ip-api.com/json/?fields=status,lat,lon,city,regionName");     

                const data = await resp.json();

                if (data.status !== "success") {
                throw new Error("IP location failed");
                }

                const { lat, lon, city, regionName } = data;

                map.setView([lat, lon], 13);

                L.circleMarker([lat, lon], {
                radius: 8,
                color: "#ff9800",
                fillColor: "#ff9800",
                fillOpacity: 0.7
                })
                .addTo(map)
                .bindPopup(`
                <strong>Approximate location</strong><br/>
                ${city || ""} ${regionName || ""}
                `)
                .openPopup();

                status.innerText = "Approximate location set";

            } catch (err) {
                console.error(err);
                status.innerText = "Location failed";
            }
        }

        // --- TOP TOOLBAR WIRING ---

        document.getElementById("runClassifyBtn").onclick = async () => {
        // const status = document.getElementById("statusText");
        // status.innerText = "Analyzing…";
        setStatus("Analyzing…");

        try {
            await loadSurfaceClassification();
            status.innerText = "Classification complete";
        } catch {
            status.innerText = "Error";
        }
        };

        document.getElementById("locateBtn").onclick = locateByIP;

        // --- HAMBURGER MENU TOGGLE ---
        // const hamburgerBtn = document.getElementById("hamburgerBtn");
        // const hamburgerPanel = document.getElementById("hamburgerPanel");

        // hamburgerBtn.onclick = () => {
        //     hamburgerPanel.classList.toggle("open");
        // };

        const hamburgerBtn = document.getElementById("hamburgerBtn");
        const hamburgerPanel = document.getElementById("hamburgerPanel");

        // Toggle panel
        hamburgerBtn.onclick = (e) => {
            e.stopPropagation();
            hamburgerPanel.classList.toggle("open");
        };

        // Click outside closes panel
        document.addEventListener("click", () => {
            hamburgerPanel.classList.remove("open");
        });

        // Prevent clicks inside panel from closing it
        hamburgerPanel.addEventListener("click", (e) => {
            e.stopPropagation();
        });

        // ESC key closes panel
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                hamburgerPanel.classList.remove("open");
            }
        });


    }); // End of DOMContentLoaded event listener
    </script>
